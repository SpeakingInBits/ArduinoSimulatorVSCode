<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<style nonce="{{nonce}}">
  body { font-family: var(--vscode-font-family); color: var(--vscode-foreground); padding: 12px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  button {
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
    border: none; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  .status { opacity: 0.8; font-size: 12px; }
  .board { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 12px;
    border: 1px solid var(--vscode-panel-border); margin-bottom: 12px; }
  .part { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
  .lamp { width: 28px; height: 28px; border-radius: 50%; background: #3a3a3a;
    border: 1px solid var(--vscode-panel-border); }
  #led.on { background: #ff3b30; box-shadow: 0 0 14px #ff3b30; }
  #console { background: var(--vscode-terminal-background, #1e1e1e);
    color: var(--vscode-terminal-foreground, #ccc); font-family: var(--vscode-editor-font-family);
    font-size: 13px; padding: 8px; height: 280px; overflow-y: auto; white-space: pre-wrap;
    outline: none; margin: 0; }
  #console:focus { outline: 1px solid var(--vscode-focusBorder); }
</style>
</head>
<body>
<div class="toolbar">
  <button id="run">Run</button>
  <button id="stop">Stop</button>
  <span class="status" id="status">Metro M0 Express</span>
</div>
<div class="board">
  <div class="part"><div class="lamp" id="led"></div>LED D13</div>
  <div class="part"><div class="lamp" id="pixel"></div>NeoPixel</div>
  <div class="part"><button id="button">Press</button>Button D2</div>
  <div class="part"><input id="pot" type="range" min="0" max="4095" value="0">Potentiometer A0</div>
</div>
<pre id="console" tabindex="0"></pre>
<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const consoleEl = document.getElementById('console');
  const led = document.getElementById('led');
  const pixel = document.getElementById('pixel');
  const button = document.getElementById('button');
  const pot = document.getElementById('pot');
  const statusEl = document.getElementById('status');

  document.getElementById('run').addEventListener('click', () => vscode.postMessage({ type: 'run' }));
  document.getElementById('stop').addEventListener('click', () => vscode.postMessage({ type: 'stop' }));
  button.addEventListener('mousedown', () => vscode.postMessage({ type: 'pin', pin: 'D2', level: 0 }));
  button.addEventListener('mouseup', () => vscode.postMessage({ type: 'pin', pin: 'D2', level: -1 }));
  pot.addEventListener('input', () => vscode.postMessage({ type: 'adc', pin: 'A0', value: Number(pot.value) }));

  // The console receives the same terminal codes a serial program would.
  let partialSerial = '';
  function appendSerial(chunk) {
    // An escape sequence can arrive split across two writes, so hold back an unfinished one.
    let text = partialSerial + chunk;
    const escapeStart = text.lastIndexOf('\x1b');
    const finished = /^\x1b(\][^\x1b]*\x1b\\|\[[0-9;]*[A-Za-z])/.test(text.slice(escapeStart));
    partialSerial = escapeStart >= 0 && !finished && !text.endsWith('\x1b\\') ? text.slice(escapeStart) : '';
    if (partialSerial) text = text.slice(0, escapeStart);
    const title = text.match(/\x1b\]0;(.*?)\x1b\\/);
    if (title) statusEl.textContent = title[1];
    const clean = text.replace(/\x1b\].*?\x1b\\/g, '').replace(/\x1b\[[0-9;]*[A-Za-z]/g, '').replace(/\r/g, '');
    for (const character of clean) {
      if (character === '\b') consoleEl.textContent = consoleEl.textContent.slice(0, -1);
      else consoleEl.textContent += character;
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  consoleEl.addEventListener('keydown', (event) => {
    let text = event.key.length === 1 ? event.key : { Enter: '\r', Backspace: '\b', Tab: '\t' }[event.key];
    if (event.ctrlKey && event.key.toLowerCase() === 'c') text = '\x03';
    if (event.ctrlKey && event.key.toLowerCase() === 'd') text = '\x04';
    if (text) {
      vscode.postMessage({ type: 'input', text });
      event.preventDefault();
    }
  });

  window.addEventListener('message', ({ data }) => {
    if (data.type === 'serial') appendSerial(data.text);
    else if (data.type === 'reset') {
      consoleEl.textContent = '';
      led.classList.remove('on');
      pixel.style.background = '';
      pixel.style.boxShadow = '';
    } else if (data.type === 'pins' && 'D13' in data.pins) led.classList.toggle('on', !!data.pins.D13);
    else if (data.type === 'neopixel') {
      const color = `rgb(${data.red}, ${data.green}, ${data.blue})`;
      pixel.style.background = color;
      pixel.style.boxShadow = `0 0 14px ${color}`;
    } else if (data.type === 'selfTest') selfTest();
  });

  const until = (condition, what, timeoutMs = 5000) => new Promise((resolve, reject) => {
    const started = performance.now();
    const poll = () => {
      if (condition()) resolve(performance.now() - started);
      else if (performance.now() - started > timeoutMs) reject(new Error(`Timed out: ${what}`));
      else setTimeout(poll, 5);
    };
    poll();
  });

  // Drives the real page controls, so a pass covers page, extension host and WebAssembly.
  async function selfTest() {
    const result = {
      crossOriginIsolated: self.crossOriginIsolated,
      sharedArrayBuffer: typeof SharedArrayBuffer,
      steps: {},
    };
    try {
      await until(() => consoleEl.textContent.includes('READY'), 'program start');
      result.steps.ledOffAtStart = !led.classList.contains('on');
      button.dispatchEvent(new MouseEvent('mousedown'));
      result.steps.pressToLedMs = Math.round(await until(() => led.classList.contains('on'), 'LED on'));
      button.dispatchEvent(new MouseEvent('mouseup'));
      result.steps.releaseToLedMs = Math.round(await until(() => !led.classList.contains('on'), 'LED off'));
      pot.value = '2048';
      pot.dispatchEvent(new Event('input'));
      result.steps.potToConsoleMs = Math.round(await until(() => consoleEl.textContent.includes('POT 2048'), 'pot value'));
      document.getElementById('stop').click();
      result.steps.stopToInterruptMs = Math.round(await until(() => consoleEl.textContent.includes('KeyboardInterrupt'), 'Stop'));
      await until(() => consoleEl.textContent.includes('Press any key'), 'program end');
      consoleEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await until(() => consoleEl.textContent.includes('>>> '), 'REPL prompt');
      for (const key of '6*7') consoleEl.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
      consoleEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await until(() => /\n42\n/.test(consoleEl.textContent), 'REPL answer');
      result.steps.replWorks = true;
      result.passed = true;
    } catch (error) {
      result.passed = false;
      result.error = String(error);
    }
    result.console = consoleEl.textContent.slice(-400);
    vscode.postMessage({ type: 'selfTestResult', result });
  }

  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
